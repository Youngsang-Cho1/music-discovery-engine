services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mde
      POSTGRES_PASSWORD: mde
      POSTGRES_DB: mde
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mde"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://mde:mde@postgres:5432/mde
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      # Cache HuggingFace weights across container restarts — CLAP is ~1.5GB.
      - hfcache:/root/.cache/huggingface

volumes:
  pgdata:
  qdrantdata:
  hfcache:
