services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mde
      POSTGRES_PASSWORD: mde
      POSTGRES_DB: mde
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mde"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Light image: no torch. Delegates text encoding to the embedder.
  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://mde:mde@postgres:5432/mde
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
      CORS_ORIGINS: http://localhost:3000
      TEXT_ENCODER_MODE: remote
      TEXT_ENCODER_URL: http://embedder:8100
    ports:
      - "8000:8000"

  # Heavy image: CLAP. Also the image ingestion runs in:
  #   docker compose run --rm embedder python -m app.ingestion.pipeline --target 500
  embedder:
    build:
      context: ./backend
      dockerfile: Dockerfile.ml
    environment:
      DATABASE_URL: postgresql+psycopg://mde:mde@postgres:5432/mde
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
    ports:
      - "8100:8100"
    volumes:
      # Weights are baked into the image; this keeps any additional downloads
      # across restarts.
      - hfcache:/models

volumes:
  pgdata:
  qdrantdata:
  hfcache:
