name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The API tests run against real Postgres — the ingestion and bandit paths
    # use ON CONFLICT, so testing on a different dialect would skip the SQL
    # that most needs checking. Qdrant is faked in-process instead.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mde
          POSTGRES_PASSWORD: mde
          POSTGRES_DB: mde
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mde"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://mde:mde@localhost:5432/mde
      DATABASE_URL: postgresql+psycopg://mde:mde@localhost:5432/mde

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # librosa decodes the mp3 previews the ingestion pipeline pulls.
      - name: Install system audio libs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1

      # The unit suite covers pure ranking/statistics logic, so torch and
      # transformers (≈2GB, needed only to embed) stay out of CI.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic pydantic-settings sqlalchemy numpy scipy \
                      httpx "psycopg[binary]" redis qdrant-client tenacity \
                      librosa soundfile pytest ruff

      - name: Lint
        run: ruff check app tests scripts

      - name: Test
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t mde-backend ./backend
